<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f6f4" />
    <meta name="description" content="Offline Fitness- und Lifestyle-Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>Fitnesstracker</title>
    <script>
      // Dark Mode und Palette vor dem ersten Rendern setzen (vermeidet Aufblitzen); Werte spiegeln die Einstellungen
      var theme = null;
      var palette = null;
      try {
        theme = localStorage.getItem('theme');
        palette = localStorage.getItem('palette');
      } catch (e) {}
      if (
        theme === 'dark' ||
        (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      }
      if (palette && /^[a-z]+$/.test(palette)) {
        document.documentElement.setAttribute('data-palette', palette);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
