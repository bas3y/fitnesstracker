# Updates und Sicherheitsmeldungen für Abhängigkeiten (SECURITY.md, Abschnitt 9)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Kleine Updates gesammelt, große Versionssprünge einzeln
      minor-und-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
