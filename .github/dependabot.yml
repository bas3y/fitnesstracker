# Updates und Sicherheitsmeldungen für Abhängigkeiten (SECURITY.md, Abschnitt 9)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Neue Versionen erst nach 7 Tagen vorschlagen (manipulierte Pakete fallen meist vorher auf)
    cooldown:
      default-days: 7
    groups:
      # Kleine Updates gesammelt, große Versionssprünge einzeln
      minor-und-patch:
        update-types: [minor, patch]
    # `typescript` bleibt auf 6.x, solange typescript-eslint TypeScript 7 nicht unterstützt
    # (Prüfen/Build laufen mit `typescript-7`, Schritt 22f)
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # Actions sind per Commit-SHA gepinnt (Kommentar = Version), Dependabot hebt SHA und Kommentar an
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
